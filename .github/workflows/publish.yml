name: Refresh football data and publish

on:
  push:
    branches: [main]
    paths:
      - index.html
      - scripts/sync-football-data.mjs
      - scripts/build-forecast-ledger.mjs
      - scripts/forecast-ledger.test.mjs
      - scripts/backtest-odds.mjs
      - scripts/backtest-odds.test.mjs
      - .github/workflows/publish.yml
  workflow_dispatch:
  schedule:
    - cron: '17 5,17 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch football data
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: node scripts/sync-football-data.mjs
      - name: Test forecast ledger
        run: node --test scripts/forecast-ledger.test.mjs
      - name: Build public forecast ledger
        run: node scripts/build-forecast-ledger.mjs
      - name: Test odds matching and scoring
        run: node --test scripts/backtest-odds.test.mjs
      - name: Backtest fixed betting rule
        run: node scripts/backtest-odds.mjs
      - name: Persist forecast ledger
        id: persist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/forecast-ledger.json data/profit-backtest.json
          if ! git diff --cached --quiet; then
            git commit -m "Update public forecast ledger"
            if ! git push origin HEAD:main; then
              remote_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
              if [ "$remote_sha" != "$GITHUB_SHA" ] && [ -n "$remote_sha" ]; then
                echo "A newer commit superseded this run; its workflow will publish the current version."
                echo "superseded=true" >> "$GITHUB_OUTPUT"
              else
                echo "Could not persist the forecast ledger."
                exit 1
              fi
            fi
          fi
      - uses: actions/configure-pages@v5
        if: steps.persist.outputs.superseded != 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.persist.outputs.superseded != 'true'
        with:
          path: site
      - id: deployment
        if: steps.persist.outputs.superseded != 'true'
        uses: actions/deploy-pages@v4
