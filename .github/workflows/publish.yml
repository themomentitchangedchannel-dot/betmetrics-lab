name: Refresh football data and publish

on:
  push:
    branches: [main]
    paths:
      - index.html
      - scripts/sync-football-data.mjs
      - scripts/build-forecast-ledger.mjs
      - scripts/forecast-ledger.test.mjs
      - .github/workflows/publish.yml
  workflow_dispatch:
  schedule:
    - cron: '17 5,17 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch football data
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: node scripts/sync-football-data.mjs
      - name: Test forecast ledger
        run: node --test scripts/forecast-ledger.test.mjs
      - name: Build public forecast ledger
        run: node scripts/build-forecast-ledger.mjs
      - name: Persist forecast ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/forecast-ledger.json
          if ! git diff --cached --quiet; then
            git commit -m "Update public forecast ledger"
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
